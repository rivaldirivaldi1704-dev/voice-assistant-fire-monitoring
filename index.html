<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Monitoring Kebakaran Gudang</title>

  <!-- MQTT.js -->
  <script src="https://unpkg.com/mqtt/dist/mqtt.min.js"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #eef2f7;
      color: #222;
    }

    .container {
      max-width: 1000px;
      margin: auto;
      padding: 25px;
    }

    h1 {
      text-align: center;
      margin-bottom: 10px;
    }

    .subtitle {
      text-align: center;
      color: #666;
      margin-bottom: 25px;
    }

    /* CONNECTION */

    #connection {
      text-align: center;
      background: white;
      padding: 12px;
      border-radius: 10px;
      margin-bottom: 20px;
      font-weight: bold;
    }

    /* STATUS */

    .status-box {
      background: white;
      border-radius: 15px;
      padding: 25px;
      text-align: center;
      margin-bottom: 20px;
      border: 4px solid #888;
    }

    .status-title {
      font-size: 18px;
      color: #666;
    }

    #status {
      font-size: 32px;
      font-weight: bold;
      margin-top: 10px;
    }

    /* GRID */

    .grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 15px;
    }

    .card {
      background: white;
      border-radius: 15px;
      padding: 25px;
      text-align: center;
      box-shadow: 0 3px 10px rgba(0,0,0,0.08);
    }

    .card-title {
      font-size: 18px;
      color: #555;
    }

    .value {
      font-size: 30px;
      font-weight: bold;
      margin-top: 10px;
    }

    /* BUTTON */

    .button-area {
      text-align: center;
      margin-top: 25px;
    }

    button {
      background: #222;
      color: white;
      border: none;
      padding: 16px 30px;
      border-radius: 10px;
      font-size: 17px;
      cursor: pointer;
    }

    button:hover {
      opacity: 0.85;
    }

    /* LOG */

    .log {
      background: #111;
      color: #00ff88;
      margin-top: 25px;
      padding: 15px;
      border-radius: 10px;
      font-family: monospace;
      font-size: 13px;
      min-height: 80px;
    }

    /* RESPONSIVE */

    @media (max-width: 600px) {
      .grid {
        grid-template-columns: 1fr;
      }

      #status {
        font-size: 25px;
      }
    }
  </style>
</head>

<body>

<div class="container">

  <h1>🔥 MONITORING KEBAKARAN GUDANG</h1>

  <div class="subtitle">
    ESP32 + DHT22 + MQTT + Voice Assistant
  </div>

  <!-- CONNECTION -->
  <div id="connection">
    🟡 Menghubungkan ke MQTT...
  </div>

  <!-- STATUS -->
  <div id="statusBox" class="status-box">

    <div class="status-title">
      STATUS SISTEM
    </div>

    <div id="status">
      MENUNGGU DATA
    </div>

  </div>

  <!-- SENSOR & DEVICE -->
  <div class="grid">

    <!-- SUHU -->
    <div class="card">
      <div class="card-title">
        🌡️ Suhu
      </div>

      <div id="suhu" class="value">
        -- °C
      </div>
    </div>


    <!-- KELEMBAPAN -->
    <div class="card">
      <div class="card-title">
        💧 Kelembapan
      </div>

      <div id="kelembapan" class="value">
        -- %
      </div>
    </div>


    <!-- LED HIJAU -->
    <div class="card">
      <div class="card-title">
        🟢 LED Hijau
      </div>

      <div id="ledHijau" class="value">
        --
      </div>
    </div>


    <!-- LED MERAH -->
    <div class="card">
      <div class="card-title">
        🔴 LED Merah
      </div>

      <div id="ledMerah" class="value">
        --
      </div>
    </div>


    <!-- BUZZER -->
    <div class="card">
      <div class="card-title">
        🔊 Buzzer
      </div>

      <div id="buzzer" class="value">
        --
      </div>
    </div>


    <!-- RELAY -->
    <div class="card">
      <div class="card-title">
        ⚡ Relay
      </div>

      <div id="relay" class="value">
        --
      </div>
    </div>

  </div>


  <!-- BUTTON VOICE -->
  <div class="button-area">

    <button onclick="bacaKondisi()">
      🔊 BACA KONDISI SEKARANG
    </button>

  </div>


  <!-- LOG -->
  <div id="log" class="log">
    Menunggu koneksi MQTT...
  </div>

</div>


<script>

/*
=========================================================
KONFIGURASI MQTT
=========================================================
*/

const MQTT_SERVER =
  "wss://broker.hivemq.com:8884/mqtt";

const MQTT_TOPIC =
  "mall/gudang/kebakaran";


/*
=========================================================
VARIABEL DATA
=========================================================
*/

let dataTerakhir = null;


/*
=========================================================
CONNECT MQTT
=========================================================
*/

const client = mqtt.connect(MQTT_SERVER, {

  clientId:
    "github-fire-monitor-" +
    Math.random()
      .toString(16)
      .substring(2),

  clean: true,

  connectTimeout: 10000,

  reconnectPeriod: 3000

});


/*
=========================================================
SAAT MQTT TERHUBUNG
=========================================================
*/

client.on("connect", function () {

  console.log("MQTT CONNECTED");

  document.getElementById("connection").innerHTML =
    "🟢 MQTT TERHUBUNG";

  log("MQTT terhubung.");

  client.subscribe(
    MQTT_TOPIC,
    function(error) {

      if (error) {

        console.error(
          "Subscribe error:",
          error
        );

        log(
          "Gagal subscribe MQTT."
        );

      }

      else {

        console.log(
          "Subscribe berhasil:",
          MQTT_TOPIC
        );

        log(
          "Berhasil subscribe topic."
        );

      }

    }
  );

});


/*
=========================================================
MQTT ERROR
=========================================================
*/

client.on("error", function(error) {

  console.error(
    "MQTT ERROR:",
    error
  );

  document.getElementById("connection").innerHTML =
    "🔴 MQTT ERROR";

  log(
    "MQTT error."
  );

});


/*
=========================================================
MQTT OFFLINE
=========================================================
*/

client.on("offline", function() {

  document.getElementById("connection").innerHTML =
    "🟠 MQTT TERPUTUS";

});


/*
=========================================================
MENERIMA PESAN MQTT
=========================================================
*/

client.on("message", function(topic, message) {

  console.log("==============================");

  console.log(
    "TOPIC:",
    topic
  );

  const raw =
    message.toString();

  console.log(
    "RAW MQTT:",
    raw
  );

  try {

    /*
    ---------------------------------------------
    UBAH JSON MENJADI OBJECT
    ---------------------------------------------
    */

    const data =
      JSON.parse(raw);


    /*
    ---------------------------------------------
    SIMPAN DATA TERAKHIR
    ---------------------------------------------
    */

    dataTerakhir = data;


    /*
    ---------------------------------------------
    TAMPILKAN KE DASHBOARD
    ---------------------------------------------
    */

    tampilkanData(data);


    /*
    ---------------------------------------------
    LOG
    ---------------------------------------------
    */

    log(
      "Data MQTT diterima: " +
      raw
    );


  }

  catch(error) {

    console.error(
      "JSON tidak valid:",
      error
    );

    log(
      "ERROR: JSON MQTT tidak valid."
    );

  }

});


/*
=========================================================
FUNGSI MENAMPILKAN DATA
=========================================================
*/

function tampilkanData(data) {

  /*
  ---------------------------------------------
  SUHU
  ---------------------------------------------
  */

  let suhu =
    Number(data.suhu);

  if (!isNaN(suhu)) {

    document.getElementById("suhu").innerText =
      suhu.toFixed(1) + " °C";

  }


  /*
  ---------------------------------------------
  KELEMBAPAN
  ---------------------------------------------
  */

  let kelembapan =
    Number(data.kelembapan);

  if (!isNaN(kelembapan)) {

    document.getElementById("kelembapan").innerText =
      kelembapan.toFixed(1) + " %";

  }


  /*
  ---------------------------------------------
  STATUS
  ---------------------------------------------
  */

  document.getElementById("status").innerText =
    data.status || "--";


  /*
  ---------------------------------------------
  LED HIJAU
  ---------------------------------------------
  */

  document.getElementById("ledHijau").innerText =
    data.led_hijau || "--";


  /*
  ---------------------------------------------
  LED MERAH
  ---------------------------------------------
  */

  document.getElementById("ledMerah").innerText =
    data.led_merah || "--";


  /*
  ---------------------------------------------
  BUZZER
  ---------------------------------------------
  */

  document.getElementById("buzzer").innerText =
    data.buzzer || "--";


  /*
  ---------------------------------------------
  RELAY
  ---------------------------------------------
  */

  document.getElementById("relay").innerText =
    data.relay || "--";


  /*
  ---------------------------------------------
  WARNA STATUS
  ---------------------------------------------
  */

  const statusBox =
    document.getElementById("statusBox");

  statusBox.style.borderColor =
    "#888";


  if (data.status === "AMAN") {

    statusBox.style.borderColor =
      "green";

  }

  else if (data.status === "WASPADA") {

    statusBox.style.borderColor =
      "orange";

  }

  else if (
    data.status ===
    "KEBAKARAN TERDETEKSI"
  ) {

    statusBox.style.borderColor =
      "red";

  }

}


/*
=========================================================
FUNGSI MENGUBAH ON/OFF/BLINK
=========================================================
*/

function bahasaIndonesia(nilai) {

  if (!nilai) {

    return "tidak diketahui";

  }


  const v =
    String(nilai)
      .toUpperCase();


  if (v === "ON") {

    return "menyala";

  }


  if (v === "OFF") {

    return "mati";

  }


  if (v === "BLINK") {

    return "berkedip";

  }


  return String(nilai);

}


/*
=========================================================
VOICE ASSISTANT
=========================================================
*/

function bacaKondisi() {

  /*
  ---------------------------------------------
  CEK DATA
  ---------------------------------------------
  */

  if (!dataTerakhir) {

    bicara(
      "Data dari sistem monitoring belum diterima."
    );

    return;

  }


  /*
  ---------------------------------------------
  AMBIL DATA
  ---------------------------------------------
  */

  const suhu =
    Number(dataTerakhir.suhu);


  const kelembapan =
    Number(dataTerakhir.kelembapan);


  const status =
    dataTerakhir.status ||
    "tidak diketahui";


  const ledHijau =
    bahasaIndonesia(
      dataTerakhir.led_hijau
    );


  const ledMerah =
    bahasaIndonesia(
      dataTerakhir.led_merah
    );


  const buzzer =
    bahasaIndonesia(
      dataTerakhir.buzzer
    );


  const relay =
    bahasaIndonesia(
      dataTerakhir.relay
    );


  /*
  ---------------------------------------------
  BUAT KALIMAT
  ---------------------------------------------
  */

  let kalimat = "";


  kalimat +=
    "Suhu " +
    suhu.toFixed(1) +
    " derajat Celsius. ";


  kalimat +=
    "Kelembapan " +
    kelembapan.toFixed(1) +
    " persen. ";


  kalimat +=
    "Status sistem " +
    status.toLowerCase() +
    ". ";


  kalimat +=
    "LED hijau " +
    ledHijau +
    ". ";


  kalimat +=
    "LED merah " +
    ledMerah +
    ". ";


  kalimat +=
    "Buzzer " +
    buzzer +
    ". ";


  kalimat +=
    "Relay " +
    relay +
    ".";


  /*
  ---------------------------------------------
  TAMPILKAN DI CONSOLE
  ---------------------------------------------
  */

  console.log(
    "KALIMAT VOICE:",
    kalimat
  );


  /*
  ---------------------------------------------
  BACA
  ---------------------------------------------
  */

  bicara(kalimat);

}


/*
=========================================================
TEXT TO SPEECH
=========================================================
*/

function bicara(teks) {

  if (
    !("speechSynthesis" in window)
  ) {

    alert(
      "Browser tidak mendukung Voice Assistant."
    );

    return;

  }


  /*
  HENTIKAN SUARA SEBELUMNYA
  */

  window.speechSynthesis.cancel();


  /*
  BUAT SUARA
  */

  const utterance =
    new SpeechSynthesisUtterance(
      teks
    );


  /*
  BAHASA INDONESIA
  */

  utterance.lang =
    "id-ID";


  /*
  KECEPATAN SUARA
  */

  utterance.rate =
    0.9;


  /*
  NADA
  */

  utterance.pitch =
    1.0;


  /*
  VOLUME
  */

  utterance.volume =
    1.0;


  /*
  JALANKAN
  */

  window.speechSynthesis.speak(
    utterance
  );

}


/*
=========================================================
LOG
=========================================================
*/

function log(teks) {

  const logElement =
    document.getElementById("log");


  const waktu =
    new Date()
      .toLocaleTimeString(
        "id-ID"
      );


  logElement.innerText =
    "[" +
    waktu +
    "] " +
    teks;

}

</script>

</body>
</html>
